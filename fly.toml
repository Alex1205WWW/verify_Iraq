# Fly.io deployment for the Verification Dispatch MVP.
#
# IMPORTANT: this app keeps its database in a SQLite file on the volume, so it
# must run on exactly ONE machine. Two machines would each get their own
# volume and their own divergent copy of the data. Do not scale this up
# without moving to Postgres first.

app = "mohamm-verification-demo"
primary_region = "fra"

[build]

[env]
  DATABASE_URL = "file:/data/app.db"
  UPLOADS_DIR = "/data/uploads"
  WHATSAPP_TEMPLATE_NAME = "task_offer"
  WHATSAPP_TEMPLATE_LANG = "en"

# SESSION_SECRET and the WhatsApp credentials are NOT set here on purpose.
# Set them with `fly secrets set`, so they never land in the repository.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "dispatch_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
